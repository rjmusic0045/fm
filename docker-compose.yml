# Local MongoDB as a single-node replica set (required by Prisma).
#   docker compose up -d
#   DATABASE_URL=mongodb://localhost:27017/lumen?replicaSet=rs0&directConnection=true
services:
  mongo:
    image: mongo:7
    container_name: lumen-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - lumen-mongo-data:/data/db
    healthcheck:
      # Initialises the replica set on first boot, then reports healthy.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 30
    restart: unless-stopped

volumes:
  lumen-mongo-data:
