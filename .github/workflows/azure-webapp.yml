# Build the Next.js app and deploy it to Azure App Service (Linux, Node 20).
#
# One-time setup (see DEPLOY.md for the full checklist):
#   GitHub repo → Settings → Secrets and variables → Actions
#     Secret   AZURE_WEBAPP_PUBLISH_PROFILE  = contents of the publish profile downloaded from the Azure portal
#     Variable NEXT_PUBLIC_APP_URL           = https://ganesh-fm-a4b6a2hpc4gwg3g8.southindia-01.azurewebsites.net
#   Azure portal → App Service → Configuration: app settings + startup command "node server.js"

name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

concurrency:
  group: azure-webapp-production
  cancel-in-progress: false # never cancel a deploy halfway

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: ganesh-fm
  NODE_VERSION: "20.x"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci # postinstall runs `prisma generate` (Linux engine included)

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', '*.mjs', '*.ts') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
        env:
          # NEXT_PUBLIC_* values are baked into the browser bundle at build time.
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Assemble standalone package
        run: |
          set -euo pipefail
          # Standalone output skips static assets and public/: copy them in.
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          # Make sure the Prisma client + Linux query engine are present.
          mkdir -p .next/standalone/node_modules/.prisma
          cp -r node_modules/.prisma/client .next/standalone/node_modules/.prisma/
          ls .next/standalone/node_modules/.prisma/client | grep -q 'debian-openssl-3.0.x' \
            || { echo "::error::Prisma Linux engine missing"; exit 1; }
          # Never ship secrets or local data.
          rm -f .next/standalone/.env .next/standalone/.env.*
          rm -rf .next/standalone/storage
          cd .next/standalone && zip -qry ../../release.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip

      - name: Smoke test
        run: |
          url="${{ steps.deploy.outputs.webapp-url }}"
          # Cold start can take a minute: retry for up to ~3 minutes.
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url/login" || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Site did not return 200 on /login"; exit 1
